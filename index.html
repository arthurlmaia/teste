<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Battle Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="overlay"></div>

    <header>
        <h1>⚔️ Pixel Battle Arena ⚔️</h1>
    </header>

    <section class="cards">
        <div class="card">Pontuação: 000</div>
        <div class="card">Vidas: 3</div>
        <div class="card">Fase: 1</div>
    </section>

    <main class="arena">

        <div class="personagem player">
            <img src="preto.png" alt="">
        </div>

        <div class="personagem aliado">
            <img src="verde.png" alt="">
        </div>

        <div class="personagem inimigo">
            <img src="careca.png" alt="">
        </div>

    </main>

    <section class="botoes">
        <button>Iniciar</button>
        <button>Reiniciar</button>
    </section>

</body>
</html>
